[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkbound-meter"
version = "0.4.12"
description = "Local combat meters and a live party overlay for Inkbound"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
inkbound-meter = "inkbound_meter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inkbound_meter = ["damage_catalog.json", "support_catalog.json", "party_catalog.json", "mitigation_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
